[pytest]
# Konfigurasi pytest untuk E2E Testing Lungsur.in (PMPL Pertemuan 9)
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Tampilkan output verbose dan hentikan setelah 1 kegagalan saat debugging
addopts =
    --verbose
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=tests/e2e/test-results

# Timeout maksimum per assertion (ms) - sesuaikan dengan kecepatan lokal
# Tidak perlu time.sleep(); Playwright menangani auto-waiting
markers =
    auth: Skenario pengujian alur autentikasi dan kontrol akses
    listing: Skenario pengujian siklus hidup status iklan
    wanted_ads: Skenario pengujian papan Wanted Ads dan batasan peran
    positive: Skenario pengujian positif (happy path)
    negative: Skenario pengujian negatif (error / edge case)

